# BuildSignal API — Cloudflare Worker (Build 110 / v1.1.0)
# Authentication, tRPC, billing, reports and customer operations
# Deployed to: api.buildsignal.com
#
# Deploy: cd packages/api && npx wrangler deploy
# Preview: cd packages/api && npx wrangler deploy --env preview
#
name = "buildsignal-worker"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database ───
# Production and preview use SEPARATE databases.
# Never share a database ID between environments.
[[d1_databases]]
binding = "DB"
database_name = "buildsignal-db-production"
database_id = "a8ecb143-6aa6-4741-b4e8-fe3e16695452"

# ─── R2 Buckets ───
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "buildsignal-documents-production"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "buildsignal-reports-production"

# ─── Queues ───
[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "buildsignal-ingestion-production"

[[queues.consumers]]
queue = "buildsignal-ingestion-production"
max_batch_size = 10
max_batch_timeout = 30

[[queues.producers]]
binding = "ALERTS_QUEUE"
queue = "buildsignal-alerts-production"

[[queues.consumers]]
queue = "buildsignal-alerts-production"
max_batch_size = 50
max_batch_timeout = 10

# ─── Cron Triggers ───
[[triggers]]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ─── Environment Variables (non-secret) ───
[vars]
APP_NAME = "buildsignal"
NODE_ENV = "production"
KESTOVAR_API_URL = "https://api.kestovar.buildsignal.com"

# ─── Custom Domain ───
# Cloudflare Custom Domains direct the entire subdomain to this Worker
routes = [
  { pattern = "api.buildsignal.com/*", custom_domain = true }
]

# ─── Service Bindings ───
# Connect to Kestovar Engine via service binding (internal, no public HTTP hop)
[[services]]
binding = "KESTOVAR"
service = "kestovar-engine"

# ─── Preview Environment ───
[env.preview]
name = "buildsignal-api-preview"

[[env.preview.d1_databases]]
binding = "DB"
# Preview database must be created via: npx wrangler d1 create buildsignal-db-preview
# Then set the database_id below before deploying preview
# BLOCKING: Replace YOUR_PREVIEW_DATABASE_ID with real preview D1 ID before deploying
preview_database_id = "YOUR_PREVIEW_DATABASE_ID"
database_name = "buildsignal-db-preview"
database_id = "YOUR_PREVIEW_DATABASE_ID"

[[env.preview.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "buildsignal-documents-preview"

[[env.preview.r2_buckets]]
binding = "REPORTS"
bucket_name = "buildsignal-reports-preview"

[env.preview.vars]
NODE_ENV = "preview"
KESTOVAR_API_URL = "https://api.kestovar.buildsignal.com"

[[env.preview.services]]
binding = "KESTOVAR"
service = "kestovar-engine-preview"

[[env.preview.queues.producers]]
binding = "INGESTION_QUEUE"
queue = "buildsignal-ingestion-preview"

[[env.preview.queues.consumers]]
queue = "buildsignal-ingestion-preview"
max_batch_size = 10
max_batch_timeout = 30

[[env.preview.queues.producers]]
binding = "ALERTS_QUEUE"
queue = "buildsignal-alerts-preview"

[[env.preview.queues.consumers]]
queue = "buildsignal-alerts-preview"
max_batch_size = 50
max_batch_timeout = 10

[[env.preview.routes]]
pattern = "api-preview.buildsignal.com/*"
custom_domain = true

# ─── Required Secrets (set via `wrangler secret put`) ───
# OWNER_UNION_ID  — Your Kimi account union ID. Only this user gets admin role.
# INTERNAL_API_SECRET — Shared secret for API→Engine service binding auth.
#                       Must match the Engine's INTERNAL_API_SECRET.
# STRIPE_SECRET_KEY — Stripe API key (live: sk_live_..., test: sk_test_...)
# STRIPE_WEBHOOK_SECRET — Stripe webhook signing secret
# STRIPE_PRICE_SCOUT — Stripe Price ID for Scout plan
# STRIPE_PRICE_PROFESSIONAL — Stripe Price ID for Professional plan
# STRIPE_PRICE_BUSINESS — Stripe Price ID for Business plan
#
# Set them: npx wrangler secret put OWNER_UNION_ID

