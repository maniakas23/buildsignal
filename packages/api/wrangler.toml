# BuildSignal API — Cloudflare Worker (Build 112 / v1.1.1)
# Managed via Cloudflare Workers (NOT Pages Functions)
# Deploy: cd packages/api && npx wrangler deploy
# Dev:    cd packages/api && npx wrangler dev --local

name = "buildsignal-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# ─── Core Variables (non-secret) ──────────────────────────────────────
[vars]
APP_NAME = "buildsignal"
NODE_ENV = "production"
KESTOVAR_API_URL = "https://api.kestovar.buildsignal.com"
FRONTEND_URL = "https://buildsignal.net"

# ─── Secrets (set via: npx wrangler secret put <NAME>) ──────────────
# ⚠ NEVER commit these to Git:
#   - DATABASE_URL (D1 uses binding below)
#   - KESTOVAR_API_KEY
#   - STRIPE_SECRET_KEY
#   - STRIPE_WEBHOOK_SECRET
#   - CLERK_SECRET_KEY
#   - CLERK_PUBLISHABLE_KEY (safe in frontend, but keep separate)
#   - INTERNAL_API_SECRET
#   - OWNER_UNION_ID

# ─── D1 Database (persistent state) ───────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "buildsignal-db"
database_id = "6ff051f6-2333-457f-8109-2c3c53501f38"

# ─── R2 Buckets (documents, reports, exports) ─────────────────────────
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "buildsignal-documents-production"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "buildsignal-reports-production"

# ─── Queues (event ingestion, alert dispatch) ─────────────────────────
[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "buildsignal-ingestion-production"

[[queues.producers]]
binding = "ALERTS_QUEUE"
queue = "buildsignal-alerts-production"

# ─── KV Namespaces ───
[[kv_namespaces]]
binding = "STRIPE_SECRETS"
id = "5d6aecfe5e114291ac407f1a0f2c18b5"

[[kv_namespaces]]
binding = "ASSETS"
id = "87dafaae03484486800f3292b1a144e3"

# ─── Service Bindings ───
# Connect to Kestovar Engine via service binding (internal, no public HTTP hop)
[[services]]
binding = "KESTOVAR"
service = "kestovar-engine"

# ═══════════════════════════════════════════════════════════════════════
# ENVIRONMENT-SPECIFIC OVERRIDES
# ═══════════════════════════════════════════════════════════════════════

[env.preview.vars]
NODE_ENV = "preview"
KESTOVAR_API_URL = "https://api.kestovar.buildsignal.com"
FRONTEND_URL = "https://preview.buildsignal.net"

[[env.preview.d1_databases]]
binding = "DB"
# Preview database: buildsignal-db-preview (UUID: 72478144-cbf1-466c-b1ed-82c666cc5f38)
database_name = "buildsignal-db-preview"
database_id = "72478144-cbf1-466c-b1ed-82c666cc5f38"

[[env.preview.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "buildsignal-documents-preview"

[[env.preview.r2_buckets]]
binding = "REPORTS"
bucket_name = "buildsignal-reports-preview"

[[env.preview.queues.producers]]
binding = "INGESTION_QUEUE"
queue = "buildsignal-ingestion-preview"

[[env.preview.queues.producers]]
binding = "ALERTS_QUEUE"
queue = "buildsignal-alerts-preview"

[[env.preview.kv_namespaces]]
binding = "STRIPE_SECRETS"
id = "14a7e06adf9b428f8e719a25b1ef6498"

[[env.preview.kv_namespaces]]
binding = "ASSETS"
id = "8bbf9ed82d5e40c087bdf16c585d2a17"

[[env.preview.services]]
binding = "KESTOVAR"
service = "kestovar-engine-preview"
