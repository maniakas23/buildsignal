# Kestovar Engine Worker — BuildSignal Intelligence Engine
# Deployed to: kestovar-engine (service binding target for buildsignal-worker)
# Also accessible at: api.kestovar.buildsignal.net
#
# Deploy: cd packages/kestovar-engine && npx wrangler deploy
#
name = "kestovar-engine"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

# ─── Custom Domain ───
routes = [
  { pattern = "api.kestovar.buildsignal.net", custom_domain = true }
]

# ─── Environment Variables (non-secret) ───
[vars]
NODE_ENV = "production"
KESTOVAR_VERSION = "1.0.0"
